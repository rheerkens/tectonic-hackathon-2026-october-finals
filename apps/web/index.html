<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#192d46"><link rel="icon" href="/sdtrust.svg" type="image/svg+xml"><title>SDtrust</title><script>/* Theme before first paint, so dark mode never flashes light. Mirrors state/theme.ts. */try{var t=localStorage.getItem("sdtrust.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
