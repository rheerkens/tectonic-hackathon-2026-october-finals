<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Finn loopt naar links</title>
<style>
html,body{margin:0;background:transparent;color:var(--foreground,#252525);font-family:var(--font-sans,system-ui)}
#finnLeft{width:100%;padding:0}
.stage{display:flex;align-items:center;justify-content:center;min-height:240px;background:var(--muted,#eee);border-radius:var(--radius,12px);padding:16px;box-sizing:border-box}
#sprite{display:block;width:192px;height:208px}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:12px 0}
button{font:inherit;padding:10px 16px;min-height:44px;border:1px solid var(--border,#999);border-radius:var(--radius,8px);background:var(--secondary,#eee);color:var(--secondary-foreground,#252525)}
#phase{font-variant-numeric:tabular-nums}
.meta{margin:12px 0;color:var(--muted-foreground,#666);font-size:14px}
.frames{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.frame{padding:4px 0;min-width:0;display:flex;align-items:center;flex-direction:column;font-size:12px;gap:2px}
.frame img{display:block;width:100%;max-width:72px;height:auto}
.frame[aria-pressed=true]{background:var(--primary,#333);color:var(--primary-foreground,#fff)}
@media(max-width:420px){.frames{grid-template-columns:repeat(4,minmax(0,1fr))}}

const durations=[120,120,120,120,120,120,120,220];
const total=durations.reduce((a,b)=>a+b,0);
const starts=durations.map((_,i)=>durations.slice(0,i).reduce((a,b)=>a+b,0));
const root=document.getElementById('finnLeft'), sprite=root.querySelector('#sprite'), toggle=root.querySelector('#toggle'), phase=root.querySelector('#phase'), buttons=Array.from(root.querySelectorAll('.frame'));
buttons.forEach((button,i)=>{button.querySelector('img').src=frames[i];});sprite.src=frames[0];

const history=[];
function currentTime(now=performance.now()){return playing?(elapsed+now-base)%total:elapsed;}
function draw(now=performance.now()){
const time=currentTime(now);
let next=starts.findIndex((start,i)=>time>=start&&time<start+durations[i]);
if(next<0)next=0;
if(next!==index){index=next;sprite.src=frames[index];buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));history.push({frame:index+1,time:Math.round(time),wall:Math.round(now)});if(history.length>48)history.shift();}

}
function setPlaying(value){if(!ready)return;const now=performance.now();elapsed=currentTime(now);base=now;playing=value;toggle.textContent=playing?'Pauzeren':'Hervatten';toggle.setAttribute('aria-label',toggle.textContent);draw(now);}
toggle.addEventListener('click',()=>setPlaying(!playing));
buttons.forEach((button,i)=>button.addEventListener('click',()=>{setPlaying(false);elapsed=starts[i];draw();}));
function tick(now){if(ready&&playing)draw(now);requestAnimationFrame(tick);}
window.finnPlayback={durations,total,get playing(){return playing},get ready(){return ready},get frame(){return index+1},get elapsed(){return currentTime()},history};
