<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finn nadenken vergelijking</title>
<style>
html,body{margin:0;background:transparent;color:var(--foreground,#242424);font-family:var(--font-sans,system-ui,sans-serif)}
#finn-thinking-comparison{width:100%}
#finn-thinking-comparison .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
#finn-thinking-comparison figure{margin:0;min-width:0;text-align:center}
#finn-thinking-comparison figcaption{margin:0 0 12px}
#finn-thinking-comparison strong{font-weight:500;display:block}
#finn-thinking-comparison .detail{color:var(--muted-foreground,#666);margin-top:4px}
#finn-thinking-comparison .stage{padding:16px;background:var(--muted,#f0f0ed);border-radius:var(--radius,8px)}
#finn-thinking-comparison img{display:block;width:192px;height:208px;margin:auto;max-width:100%;object-fit:contain}
#finn-thinking-comparison .position{font-variant-numeric:tabular-nums;margin:10px 0 0}
#finn-thinking-comparison .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
#finn-thinking-comparison button{font:inherit;min-height:44px;padding:8px 16px;background:var(--secondary,#e8e8e6);color:var(--secondary-foreground,#242424);border:1px solid var(--border,#bbb);border-radius:var(--radius,8px)}
#finn-thinking-comparison .note{color:var(--muted-foreground,#666);margin:12px 0 0}
@media(max-width:479px){#finn-thinking-comparison .pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="finn-thinking-comparison" aria-label="Bewegende vergelijking van Finns denkpose">
  <div class="pair">
    <figure>
      <figcaption><strong>Origineel</strong><div class="detail">6 frames · lus van 820 ms</div></figcaption>
      <div class="stage"><img id="thinking-source" width="192" height="208" alt="Finn in de oorspronkelijke denkpose"></div>
      <p class="position" id="source-position">Frame 1 van 6</p>
    </figure>
    <figure>
      <figcaption><strong>Voorstel</strong><div class="detail">6 frames, 4 houdingen · lus van 4400 ms</div></figcaption>
      <div class="stage"><img id="thinking-trial" width="192" height="208" alt="Finn met twee getekende tussenposes en vaste voeten, kandidaat 02"></div>
      <p class="position" id="trial-position">Frame 1 van 6</p>
    </figure>
  </div>
  <div class="controls"><button class="btn" id="thinking-toggle" type="button" disabled>Pauzeren</button><span id="thinking-status" role="status">Beelden laden</span></div>
  <p class="note">Rechts: twee getekende tussenposes, dezelfde weg terug en een langere denkpauze. Vaste voeten en schaal. Goedgekeurd voor overname. Integratie via de centrale Finn sessie.</p>
</section>

  const durations = [[120, 120, 120, 120, 120, 220], [3540, 100, 110, 440, 110, 100]];
  const sequences = [[0, 1, 2, 3, 4, 5], [0, 6, 7, 8, 7, 6]];
  const totals = durations.map(list => list.reduce((a,b) => a+b,0));
  const displays = [root.querySelector('#thinking-source'),root.querySelector('#thinking-trial')];
  const labels = [root.querySelector('#source-position'),root.querySelector('#trial-position')];
  const toggle = root.querySelector('#thinking-toggle');
  const status = root.querySelector('#thinking-status');
  let elapsed = 0;
  let previous = 0;
  let playing = true;
  let ready = false;
  const last = [-1,-1];
  const position = (time,list) => {
    let end = 0;
    for(let index=0;index<list.length;index++){
      end += list[index];
      if(time < end) return index;
    }
    return list.length-1;
  };
  function draw(){
    durations.forEach((list,index) => {
      const time = elapsed % totals[index];
      const frame = position(time,list);
      if(last[index] !== frame){
        displays[index].src = frames[sequences[index][frame]];
        displays[index].dataset.frame = String(frame);
        last[index] = frame;
      }
      labels[index].textContent = `Frame ${frame+1} van 6 · ${Math.floor(time)} / ${totals[index]} ms`;
    });
    root.dataset.elapsed = String(Math.floor(elapsed));
    root.dataset.playing = String(playing);
  }
  function tick(now){
    if(ready && playing) elapsed += now-previous;
    previous = now;
    if(ready) draw();
    requestAnimationFrame(tick);
  }
  toggle.addEventListener('click',() => {
    playing = !playing;
    previous = performance.now();
    toggle.textContent = playing ? 'Pauzeren' : 'Hervatten';
    status.textContent = playing ? 'Beide animaties spelen' : 'Beide animaties gepauzeerd';
    draw();
  });
  Promise.all(frames.map(src => new Promise((resolve,reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = src;
  }))).then(() => {
    ready = true;
    toggle.disabled = false;
    previous = performance.now();
    status.textContent = 'Beide animaties spelen';
    root.dataset.ready = 'true';
    draw();
    console.log('Finn kandidaat 02: negen unieke PNG beelden geladen; lussen 820 en 4400 ms.');
  }).catch(() => {status.textContent = 'Beelden konden niet laden';console.error('Finn PNG laadfout');});
  requestAnimationFrame(tick);
})();
