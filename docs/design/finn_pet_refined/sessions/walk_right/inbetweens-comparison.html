<head>

<title>Finn lopen rechts, tussenposes 02</title>
<style>
html,body{margin:0;background:transparent;color:var(--foreground,#242424);font-family:var(--font-sans,system-ui,sans-serif)}
#finn-walk-comparison{width:100%}
#finn-walk-comparison .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
#finn-walk-comparison figure{margin:0;min-width:0;text-align:center}
#finn-walk-comparison figcaption{margin:0 0 12px}
#finn-walk-comparison strong{font-weight:500;display:block}
#finn-walk-comparison .detail{color:var(--muted-foreground,#666);margin-top:4px}
#finn-walk-comparison .stage{padding:16px;background:var(--muted,#f0f0ed);border-radius:var(--radius,8px)}
#finn-walk-comparison img{display:block;width:192px;height:208px;margin:auto;max-width:100%;object-fit:contain}
#finn-walk-comparison .position{font-variant-numeric:tabular-nums;margin:10px 0 0}
#finn-walk-comparison .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
#finn-walk-comparison button{font:inherit;min-height:44px;padding:8px 16px;background:var(--secondary,#e8e8e6);color:var(--secondary-foreground,#242424);border:1px solid var(--border,#bbb);border-radius:var(--radius,8px)}
#finn-walk-comparison .note{color:var(--muted-foreground,#666);margin:12px 0 0}
@media(max-width:479px){#finn-walk-comparison .pair{grid-template-columns:1fr}}
</style>
</head>

const orders=[[0,1,2,3,4,5,6,7],[0, 8, 1, 2, 3, 9, 4, 8, 5, 6, 7, 9]];
const durations=[[120,120,120,120,120,120,120,220],[70, 70, 130, 130, 65, 65, 70, 70, 130, 130, 65, 65]];
const totals=durations.map(list=>list.reduce((a,b)=>a+b,0));
const displays=[root.querySelector('#source'),root.querySelector('#trial')];
const labels=[root.querySelector('#source-position'),root.querySelector('#trial-position')];
const toggle=root.querySelector('#toggle'),status=root.querySelector('#status');
let elapsed=0,previous=0,playing=true,ready=false;
const last=[-1,-1];
function draw(){
  durations.forEach((list,index)=>{
    const time=elapsed%totals[index];
    let frame=0,end=list[0];
    while(frame<list.length-1&&time>=end)end+=list[++frame];
    if(last[index]!==frame){displays[index].src=frames[orders[index][frame]];displays[index].dataset.frame=String(frame);displays[index].dataset.asset=String(orders[index][frame]);last[index]=frame;}
    labels[index].textContent='Frame '+(frame+1)+' van '+list.length+' · '+Math.floor(time)+' / '+totals[index]+' ms';
  });
  root.dataset.elapsed=String(Math.floor(elapsed));root.dataset.playing=String(playing);
}
function tick(now){
  if(ready&&playing&&!document.hidden)elapsed+=now-previous;
  previous=now;if(ready)draw();requestAnimationFrame(tick);
}
toggle.addEventListener('click',()=>{
  playing=!playing;previous=performance.now();
  toggle.textContent=playing?'Pauzeren':'Hervatten';
  status.textContent=playing?'Beide animaties spelen':'Beide animaties gepauzeerd';draw();
});
document.addEventListener('visibilitychange',()=>{previous=performance.now();});
Promise.all(frames.map(src=>new Promise((resolve,reject)=>{
  const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;
}))).then(images=>{
  ready=true;toggle.disabled=false;previous=performance.now();
  status.textContent='Beide animaties spelen';root.dataset.ready='true';draw();
  console.log('Finn rechts 02: '+images.length+' unieke PNG beelden; 8 originele en 12 kandidaatframes; beide 1060 ms; één gedeelde klok.');
}).catch(()=>{status.textContent='Beelden konden niet laden';console.error('Finn PNG laadfout');});
requestAnimationFrame(tick);
})();
