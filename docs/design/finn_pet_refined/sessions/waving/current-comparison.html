<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finn waving vergelijking</title>
<style>
html,body{margin:0;background:transparent;color:var(--foreground,#242424);font-family:var(--font-sans,system-ui,sans-serif)}
#finn-waving-comparison{width:100%}
#finn-waving-comparison .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
#finn-waving-comparison figure{margin:0;min-width:0;text-align:center}
#finn-waving-comparison figcaption{margin:0 0 12px}
#finn-waving-comparison strong{font-weight:500;display:block}
#finn-waving-comparison .detail{color:var(--muted-foreground,#666);margin-top:4px}
#finn-waving-comparison .stage{padding:16px;background:var(--muted,#f0f0ed);border-radius:var(--radius,8px)}
#finn-waving-comparison img{display:block;width:192px;height:208px;margin:auto;max-width:100%;object-fit:contain}
#finn-waving-comparison .position{font-variant-numeric:tabular-nums;margin:10px 0 0}
#finn-waving-comparison .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
#finn-waving-comparison button{font:inherit;min-height:44px;padding:8px 16px;background:var(--secondary,#e8e8e6);color:var(--secondary-foreground,#242424);border:1px solid var(--border,#bbb);border-radius:var(--radius,8px)}
#finn-waving-comparison .note{color:var(--muted-foreground,#666);margin:12px 0 0}
@media(max-width:479px){#finn-waving-comparison .pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="finn-waving-comparison" aria-label="Bewegende vergelijking van Finn waving">
  <div class="pair">
    <figure>
      <figcaption><strong>Origineel</strong><div class="detail">4 frames · lus van 700 ms</div></figcaption>
      <div class="stage"><img id="waving-source" width="192" height="208" alt="Finn in de oorspronkelijke zwaaianimatie"></div>
      <p class="position" id="source-position">Frame 1</p>
    </figure>
    <figure>
      <figcaption><strong>Voorstel</strong><div class="detail">5 frames · lus van 2400 ms</div></figcaption>
      <div class="stage"><img id="waving-trial" width="192" height="208" alt="Finn met een rustiger zwaairitme en terugkeer naar rust"></div>
      <p class="position" id="trial-position">Frame 1</p>
    </figure>
  </div>
  <div class="controls"><button class="btn" id="waving-toggle" type="button" disabled>Pauzeren</button><span id="waving-status" role="status">Beelden laden</span></div>
  <p class="note">Bestaande beelden op 192 bij 208 pixels. Rechts is een timingvoorstel met de bestaande rustpose, nog niet goedgekeurd.</p>
</section>

  const durations = [[140,140,140,280],[200,200,240,200,1560]];
  const totals = durations.map(list => list.reduce((a,b) => a+b,0));
  const displays = [root.querySelector('#waving-source'),root.querySelector('#waving-trial')];
  const labels = [root.querySelector('#source-position'),root.querySelector('#trial-position')];
  const toggle = root.querySelector('#waving-toggle');
  const status = root.querySelector('#waving-status');
  let elapsed = 0;
  let previous = 0;
  let playing = true;
  let ready = false;
  const last = [-1,-1];
  const position = (time,list) => {
    let end = 0;
    for(let index=0;index<list.length;index++){
      end += list[index];
      if(time < end) return index;
    }
    return list.length-1;
  };
  function draw(){
    durations.forEach((list,index) => {
      const time = elapsed % totals[index];
      const frame = position(time,list);
      if(last[index] !== frame){
        displays[index].src = frames[frame];
        displays[index].dataset.frame = String(frame);
        last[index] = frame;
      }
      labels[index].textContent = `Frame ${frame+1} van ${list.length} · ${Math.floor(time)} / ${totals[index]} ms`;
    });
    root.dataset.elapsed = String(Math.floor(elapsed));
    root.dataset.playing = String(playing);
  }
  function tick(now){
    if(ready && playing) elapsed += now-previous;
    previous = now;
    if(ready) draw();
    requestAnimationFrame(tick);
  }
  toggle.addEventListener('click',() => {
    playing = !playing;
    previous = performance.now();
    toggle.textContent = playing ? 'Pauzeren' : 'Hervatten';
    status.textContent = playing ? 'Beide animaties spelen' : 'Beide animaties gepauzeerd';
    draw();
  });
  Promise.all(frames.map(src => new Promise((resolve,reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = src;
  }))).then(() => {
    ready = true;
    toggle.disabled = false;
    previous = performance.now();
    status.textContent = 'Beide animaties spelen';
    root.dataset.ready = 'true';
    draw();
    console.log('Finn waving: vijf oorspronkelijke PNG beelden geladen; lussen 700 en 2400 ms.');
  }).catch(() => {status.textContent = 'Beelden konden niet laden';console.error('Finn PNG laadfout');});
  requestAnimationFrame(tick);
})();
