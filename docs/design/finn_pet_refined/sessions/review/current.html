const durations=[150,150,150,150,150,280],total=1030;
const root=document.getElementById('finn-review'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
const play=root.querySelector('#play'),range=root.querySelector('#time'),label=root.querySelector('#position');
let images=[],playing=true,position=0,last=0,index=-1,seen=new Set(),reported=false;
function draw(){
let end=0;const i=durations.findIndex(d=>{end+=d;return position<end});
if(i!==index){ctx.clearRect(0,0,192,208);ctx.drawImage(images[i],0,0);index=i;seen.add(i);}
canvas.dataset.frame=String(i);range.value=String(Math.floor(position));label.value='Frame '+(i+1)+' / 6 · '+Math.floor(position)+' ms';
}
function tick(now){if(last&&playing)position=(position+now-last)%total;last=now;draw();if(!reported&&seen.size===6){console.info('Review: alle 6 oorspronkelijke frames afgespeeld; lus 1030 ms; tijden '+durations.join(', '));reported=true;}requestAnimationFrame(tick);}
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pauzeren':'Hervatten';};
range.oninput=()=>{playing=false;play.textContent='Hervatten';position=Number(range.value);draw();};
Promise.all(frames.map(src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;}))).then(loaded=>{images=loaded;play.disabled=false;console.info('Review: '+loaded.length+' PNG beelden geladen, '+loaded[0].width+' bij '+loaded[0].height);requestAnimationFrame(tick);}).catch(()=>{label.value='Beelden konden niet laden';});
})();
