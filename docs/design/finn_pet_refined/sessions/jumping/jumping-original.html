  const durations = [140, 140, 140, 140, 280];
  const total = durations.reduce((a, b) => a + b, 0);
  const root = document.getElementById('finn-jumping');
  const picture = root.querySelector('#jump');
  const button = root.querySelector('#toggle');
  const position = root.querySelector('#position');
  let paused = false, elapsed = 0, previous = null, current = -1, ready = false;
  const images = sources.map(src => { const img = new Image(); img.src = src; return img; });
  function draw() {
    let remaining = elapsed % total, frame = 0;
    while (frame < durations.length - 1 && remaining >= durations[frame]) remaining -= durations[frame++];

    root.dataset.frame = String(frame + 1);
    root.dataset.elapsed = String(Math.floor(elapsed % total));
  }
  button.addEventListener('click', () => {
    paused = !paused; previous = null;
    button.textContent = paused ? 'Hervatten' : 'Pauzeren';
    root.dataset.paused = String(paused);
    root.querySelector('#status').textContent = paused ? 'Animatie gepauzeerd' : 'Animatie hervat';
  });
  function tick(now) {
    if (ready && !paused && previous !== null) elapsed += now - previous;
    previous = now; draw(); requestAnimationFrame(tick);
  }
  draw();
  Promise.all(images.map(img => img.decode())).then(() => {
    ready = true; previous = null; root.dataset.ready = 'true';
    console.info('Finn jumping: 5 PNG frames loaded; durations 140,140,140,140,280; loop 840 ms.');
    requestAnimationFrame(tick);
  }).catch(error => { root.querySelector('#status').hidden = false; root.querySelector('#status').textContent = 'Beelden laden niet.'; console.error(error); });
