<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finn idle vergelijking</title>
<style>
html,body{margin:0;background:transparent;color:var(--foreground,#242424);font-family:var(--font-sans,system-ui,sans-serif)}
#finn-idle-comparison{width:100%}
#finn-idle-comparison .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
#finn-idle-comparison figure{margin:0;min-width:0;text-align:center}
#finn-idle-comparison figcaption{margin:0 0 12px}
#finn-idle-comparison strong{font-weight:500;display:block}
#finn-idle-comparison .detail{color:var(--muted-foreground,#666);margin-top:4px}
#finn-idle-comparison .stage{padding:16px;background:var(--muted,#f0f0ed);border-radius:var(--radius,8px)}
#finn-idle-comparison img{display:block;width:192px;height:208px;margin:auto;max-width:100%;object-fit:contain}
#finn-idle-comparison .position{font-variant-numeric:tabular-nums;margin:10px 0 0}
#finn-idle-comparison .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
#finn-idle-comparison button{font:inherit;min-height:44px;padding:8px 16px;background:var(--secondary,#e8e8e6);color:var(--secondary-foreground,#242424);border:1px solid var(--border,#bbb);border-radius:var(--radius,8px)}
#finn-idle-comparison .note{color:var(--muted-foreground,#666);margin:12px 0 0}
@media(max-width:479px){#finn-idle-comparison .pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="finn-idle-comparison" aria-label="Bewegende vergelijking van Finn idle">

      <figcaption><strong>Origineel</strong><div class="detail">6 frames · lus van 1100 ms</div></figcaption>
      <div class="stage"><img id="idle-source" width="192" height="208" alt="Finn in de oorspronkelijke idle animatie"></div>
      <p class="position" id="source-position">Frame 1 van 6</p>
    </figure>
    <figure>
      <figcaption><strong>Proef 01 · voorkeur</strong><div class="detail">Dezelfde 6 frames · lus van 4400 ms</div></figcaption>
      <div class="stage"><img id="idle-trial" width="192" height="208" alt="Finn in de rustigere idle proef 01"></div>
      <p class="position" id="trial-position">Frame 1 van 6</p>
    </figure>
  </div>
  <div class="controls"><button class="btn" id="idle-toggle" type="button" disabled>Pauzeren</button><span id="idle-status" role="status">Beelden laden</span></div>
  <p class="note">Oorspronkelijke PNG beelden op 192 bij 208 pixels. Proef 02 is visueel onvoldoende en blijft buiten deze vergelijking.</p>
</section>

  const durations = [[280,110,110,140,140,320],[1400,900,90,110,120,1780]];
  const totals = durations.map(list => list.reduce((a,b) => a+b,0));
  const displays = [root.querySelector('#idle-source'),root.querySelector('#idle-trial')];
  const labels = [root.querySelector('#source-position'),root.querySelector('#trial-position')];
  const toggle = root.querySelector('#idle-toggle');
  const status = root.querySelector('#idle-status');
  let elapsed = 0;
  let previous = 0;
  let playing = true;
  let ready = false;
  const last = [-1,-1];
  const position = (time,list) => {
    let end = 0;
    for(let index=0;index<list.length;index++){
      end += list[index];
      if(time < end) return index;
    }
    return list.length-1;
  };
  function draw(){
    durations.forEach((list,index) => {
      const time = elapsed % totals[index];
      const frame = position(time,list);
      if(last[index] !== frame){
        displays[index].src = frames[frame];
        displays[index].dataset.frame = String(frame);
        last[index] = frame;
      }
      labels[index].textContent = `Frame ${frame+1} van 6 · ${Math.floor(time)} / ${totals[index]} ms`;
    });
    root.dataset.elapsed = String(Math.floor(elapsed));
    root.dataset.playing = String(playing);
  }
  function tick(now){
    if(ready && playing) elapsed += now-previous;
    previous = now;
    if(ready) draw();
    requestAnimationFrame(tick);
  }
  toggle.addEventListener('click',() => {
    playing = !playing;
    previous = performance.now();
    toggle.textContent = playing ? 'Pauzeren' : 'Hervatten';
    status.textContent = playing ? 'Beide animaties spelen' : 'Beide animaties gepauzeerd';
    draw();
  });
  Promise.all(frames.map(src => new Promise((resolve,reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = src;
  }))).then(() => {
    ready = true;
    toggle.disabled = false;
    previous = performance.now();
    status.textContent = 'Beide animaties spelen';
    root.dataset.ready = 'true';
    draw();
    console.log('Finn idle: zes PNG beelden geladen; lussen 1100 en 4400 ms.');
  }).catch(() => {status.textContent = 'Beelden konden niet laden';console.error('Finn PNG laadfout');});
  requestAnimationFrame(tick);
})();
