<title>Finn Teleurstelling vergelijking</title><style>
html,body{margin:0;background:transparent;color:var(--foreground,#242424);font-family:var(--font-sans,system-ui,sans-serif)}
#finn-failed-comparison{width:100%}
#finn-failed-comparison .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
#finn-failed-comparison figure{margin:0;min-width:0;text-align:center}
#finn-failed-comparison figcaption{margin:0 0 12px}
#finn-failed-comparison strong{font-weight:500;display:block}

#finn-failed-comparison .position{font-variant-numeric:tabular-nums;margin:10px 0 0}
#finn-failed-comparison .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
#finn-failed-comparison button{font:inherit;min-height:44px;padding:8px 16px;background:var(--secondary,#e8e8e6);color:var(--secondary-foreground,#242424);border:1px solid var(--border,#bbb);border-radius:var(--radius,8px)}
#finn-failed-comparison .note{color:var(--muted-foreground,#666);margin:12px 0 0}
@media(max-width:479px){#finn-failed-comparison .pair{grid-template-columns:1fr}}

  const sequences = [[0, 1, 2, 3, 4, 5, 6, 7], [0, 8, 9, 10, 11, 10, 9, 8, 0]];
  const durations = [[140, 140, 140, 140, 140, 140, 140, 240], [120, 90, 90, 90, 240, 100, 100, 100, 2470]];
  const totals = durations.map(list => list.reduce((a,b) => a+b,0));
  const displays = [root.querySelector('#failed-source'),root.querySelector('#failed-trial')];
  const labels = [root.querySelector('#source-position'),root.querySelector('#trial-position')];
  const toggle = root.querySelector('#failed-toggle');
  const status = root.querySelector('#failed-status');
  let elapsed = 0, previous = 0, playing = true, ready = false;
  const last = [-1,-1];
  const visited = [new Set(), new Set()];
  function position(time,list){
    let end = 0;
    for(let i=0;i<list.length;i++){end+=list[i];if(time<end)return i;}
    return list.length-1;
  }
  function draw(){
    durations.forEach((list,i) => {
      const time = elapsed % totals[i];
      const frame = position(time,list);
      if(last[i]!==frame){
        displays[i].src=frames[sequences[i][frame]];
        displays[i].dataset.frame=String(frame);
        displays[i].dataset.sourceFrame=String(sequences[i][frame]);
        last[i]=frame;
        visited[i].add(frame);
      }
      labels[i].textContent=`Frame ${frame+1} van ${list.length} · ${Math.floor(time)} / ${totals[i]} ms`;
    });
    root.dataset.elapsed=String(Math.floor(elapsed));
    root.dataset.playing=String(playing);
    root.dataset.visited=JSON.stringify(visited.map(s=>[...s]));
  }
  function tick(now){
    if(ready&&playing)elapsed+=now-previous;
    previous=now;
    if(ready)draw();
    requestAnimationFrame(tick);
  }
  toggle.addEventListener('click',()=>{
    playing=!playing;previous=performance.now();
    toggle.textContent=playing?'Pauzeren':'Hervatten';
    toggle.setAttribute('aria-pressed',String(!playing));
    status.textContent=playing?'Beide animaties spelen':'Beide animaties gepauzeerd';draw();
  });
  Promise.all(frames.map(src=>new Promise((resolve,reject)=>{
    const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src;
  }))).then(()=>{
    ready=true;toggle.disabled=false;previous=performance.now();
    status.textContent='Beide animaties spelen';root.dataset.ready='true';draw();
    console.log('Finn Teleurstelling: 8 bronbeelden en 4 nieuwe poses geladen; lussen 1220 en 3400 ms.');
  }).catch(()=>{status.textContent='Beelden konden niet laden';console.error('Finn PNG laadfout');});
  requestAnimationFrame(tick);
})();
